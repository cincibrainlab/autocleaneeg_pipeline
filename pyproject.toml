[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocleaneeg-pipeline"
dynamic = ["version"]
description = "A modular framework for automated EEG data processing, built on MNE-Python"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE.md"}
keywords = ["eeg", "neuroscience", "signal-processing", "preprocessing", "mne-python", "bids", "electrophysiology"]
authors = [
    { name = "Ernest Pedapati", email = "ernest.pedapati@cchmc.org" },
    { name = "Gavin Gammoh", email = "gavin.gammoh@cchmc.org" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # Core scientific computing
    "numpy==1.26.4",
    "scipy==1.16.2",
    "pandas==2.3.3",
    "matplotlib==3.10.6",
    "seaborn==0.13.2",
    "PyWavelets==1.9.0",
    # EEG processing core
    "mne==1.10.2",
    "mne-icalabel==0.8.1",
    "mne-bids==0.17.0",
    "autoreject==0.4.3",
    "pyprep==0.5.0",
    "python-picard==0.8",
    # EEG file formats
    "eeglabio==0.1.2",
    "pybv==0.7.6",
    "fastparquet==2024.11.0",
    # Connectivity analysis
    "mne-connectivity==0.7.0",
    "networkx==3.5",
    "bctpy==0.6.1",
    "specparam==2.0.0rc6",
    "bycycle==1.2.0",
    # Machine learning
    "torch==2.2.2",
    # Utilities and data handling
    "rich==14.1.0",
    "python-dotenv==1.1.1",
    "defusedxml==0.7.1",
    "pyyaml==6.0.2",
    "schema==0.7.8",
    "watchfiles==1.1.1",

    "Jinja2==3.1.6",
    "python-ulid==3.1.0",
    "cython==3.1.4",
    "loguru==0.7.3",
    "pydantic==2.11.9",
    "reportlab==4.4.4",
    "nibabel==5.3.2",
    "platformdirs==4.4.0",
    # Authentication and compliance
    "auth0-python==4.13.0",
    "requests==2.32.5",
    "cryptography==46.0.1",
    "inquirer==3.4.1",
    "autocleaneeg-icvision==0.2.1",
    "autoclean-eeg2source==0.3.7",
    "autocleaneeg-view==0.1.6",
    # GUI dependencies
    "PyQt6==6.7.1",
    "autocleaneeg-mne-qt-browser-fork==0.8.2",
    # "PySide6>=6.5.0",
    "pyjsonviewer==1.6.0",
    "textual==6.1.0",
    "textual-dev==1.7.0",
    "pyvistaqt==0.11.3",
    "qtpy==2.4.3",
    # OpenGL acceleration
    "PyOpenGL-accelerate==3.1.10",
    # Documentation handled externally; keep Python package lean
    # AI dependencies
    "openai==1.109.0",
    "onnxruntime==1.22.1",
    # API and queue dependencies
    "fastapi==0.135.1",
    "uvicorn==0.42.0",
    "redis==7.3.0",
    "rq==2.7.0",
    "websockets==16.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
# Contributor and docs helpers
dev = [
    "black==25.9.0",
    "isort==6.0.1",
    "mypy==1.18.2",
    "ruff==0.15.20",
    "pre-commit==4.3.0",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "pytest-asyncio==1.3.0",
]

docs = [
    "numpydoc==1.9.0",
    "pydata-sphinx-theme==0.16.1",
    "sphinx==8.2.3",
    "sphinx-gallery==0.19.0",
]

# Compatibility extra for docs/messages that reference review GUI support.
gui = []

# Optional dependencies for processing blocks
# Install with: uv tool install "autocleaneeg-pipeline[blocks-all]"
# Or individual groups: uv tool install "autocleaneeg-pipeline[blocks-signal]"

# MATLAB support
# Requires a matching local MATLAB installation and compatible Python architecture.
matlab = [
    "matlabengine==25.2.2",
]

# Signal processing blocks
blocks-signal = [
    "meegkit==0.1.9",  # Required for zapline DSS-based line noise removal
]

# Analysis blocks (currently all dependencies in main package)
blocks-analysis = []

# All optional block dependencies
blocks-all = [
    "meegkit==0.1.9",
]

[tool.uv.sources]
#autocleaneeg-mne-qt-browser-fork = { path = "/home/ernie/Documents/Github/autocleaneeg-mne-qt-browser-fork", editable = true }
#autocleaneeg-mne-qt-browser-fork = { path = "/Volumes/braindata/cincineuro_github/mne-qt-browser", editable = true }


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.urls]
Homepage = "https://github.com/cincibrainlab/autoclean_pipeline"
Repository = "https://github.com/cincibrainlab/autoclean_pipeline"
Documentation = "https://cincibrainlab.github.io/autoclean_pipeline/"
Issues = "https://github.com/cincibrainlab/autoclean_pipeline/issues"

[project.scripts]
autocleaneeg-pipeline = "autoclean.__main__:main"
autocleaneeg-serve = "autoclean.serve_launcher:main"
autocleaneeg-tui = "autoclean.tui.app:main"

[tool.hatch.version]
path = "src/autoclean/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/autoclean", "configs"]

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "LICENSE.md",
    "CITATION.cff",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "src/autoclean/**",
    "configs/**",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=autoclean"
testpaths = [
    "tests",
]

[tool.coverage.run]
omit = [
    "src/autoclean/templates/*.jinja",
]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
exclude = [
    "autoclean/tasks/TEMPLATE.py",
    ".git",
    ".env",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
per-file-ignores = { "autoclean/step_functions/__init__.py" = ["E402", "F403"], "autoclean/tools/autoclean_review.py" = ["E402"], "autoclean/calc/source.py" = ["F401"] }
