name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install black==25.9.0 isort==6.0.1 mypy==1.18.2 ruff==0.15.20

      # TODO: restore whole-repo formatting/linting once the existing baseline is clean.
      - name: Run formatting checks on changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- '*.py' | grep -v '^tests/fixtures/tasks/bad_syntax_task.py$' || true)
          if [ -z "$files" ]; then
            echo "No changed Python files to format-check."
            exit 0
          fi
          black --check $files
          isort --check-only $files

      - name: Run lint on changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- '*.py' | grep -v '^tests/fixtures/tasks/bad_syntax_task.py$' || true)
          if [ -z "$files" ]; then
            echo "No changed Python files to lint."
            exit 0
          fi
          ruff check $files

      # TODO: make mypy blocking after a typed baseline or per-module allowlist exists.
      - name: Run type checks (advisory baseline)
        run: |
          mypy src/autoclean || echo "mypy baseline is currently advisory; changed-file lint remains blocking."

  tests:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: /tmp/matplotlib
      MNE_HOME: /tmp/mne
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-mock pytest-asyncio

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short --maxfail=5

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build package artifacts
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Install wheel and smoke test entrypoints
        run: |
          python -m pip install dist/*.whl
          autocleaneeg-pipeline version
          autocleaneeg-serve --help >/dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  docs:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: /tmp/matplotlib
      MNE_HOME: /tmp/mne
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[docs]"

      - name: Build docs
        run: make docs-build
